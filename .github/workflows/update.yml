name: Обновление цен с сайта Брусники
on:
  schedule:
    - cron: "*/5 * * * *"  # каждые 5 минут (GitHub может задерживать запуск)
    - cron: "30 0 * * *"   # 03:30 по Москве — полная сверка всех страниц квартир
  workflow_dispatch:
    inputs:
      full:
        description: "Полная сверка всех страниц квартир"
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node update.mjs
        env:
          FULL: ${{ github.event.schedule == '30 0 * * *' || inputs.full }}
      # Коммит только при изменении квартир; время проверки уходит на сайт без коммита.
      - name: Коммит изменений
        run: |
          if [ -f .changed ]; then
            git add -A data.js img
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -m "Обновление цен $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M')"
            git push
          fi
          rm -f .changed
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
